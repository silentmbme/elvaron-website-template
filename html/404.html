<!doctype html>
<html lang="en" class="no-js">

<head>
  <include src="html/partials/head/head.html"
    title="Page Not Found | Elvaron"
    description="The page you are looking for could not be found. Return to the Elvaron homepage to explore our services, projects, and latest insights."
    keywords="Elvaron, page not found"
    robots="noindex, follow"></include>
</head>

<body class="error-route">
  <include src="html/partials/components/loader.html"></include>
  <include src="html/partials/headers/default.html"></include>
  <include src="html/partials/customizer/customizer.html"></include>
  <main id="main">
    <section class="error-simple">
      <div class="container">
        <p class="eyebrow"><span class="status-dot"></span>ERROR 404</p>
        <svg class="error-404-illustration" viewBox="0 0 480 200" role="img" aria-label="404">
          <defs>
            <linearGradient id="errorNumberFill" x1="70" y1="30" x2="390" y2="175" gradientUnits="userSpaceOnUse">
              <stop stop-color="var(--sn-primary)" />
              <stop offset="1" stop-color="var(--sn-secondary)" />
            </linearGradient>
          </defs>
          <path d="M29 155c53 0 41-91 99-91 31 0 33 24 59 24s31-34 62-34 43 39 68 39 38-28 69-28"
            stroke="var(--sn-secondary)" stroke-opacity=".22" stroke-width="2" stroke-dasharray="4 8" fill="none" />
          <text x="240" y="154" text-anchor="middle" fill="url(#errorNumberFill)" stroke="var(--sn-ink)"
            stroke-width="2" paint-order="stroke" font-family="Bricolage Grotesque, sans-serif" font-size="164"
            font-weight="800" letter-spacing="-12">
            404
          </text>
          <circle cx="29" cy="155" r="6" fill="var(--sn-ink)" />
          <circle cx="387" cy="65" r="7" fill="var(--sn-surface)" stroke="var(--sn-ink)" stroke-width="2" />
          <path d="m428 35 3 8 8 3-8 3-3 8-3-8-8-3 8-3 3-8Z" fill="var(--sn-primary)" stroke="var(--sn-ink)"
            stroke-width="1.5" stroke-linejoin="round" />
        </svg>
        <h1>Page not found</h1>
        <p class="error-simple-message">
          The page you’re looking for may have moved or no longer exists.
        </p>
        <div class="error-simple-actions">
          <a href="/index.html" class="btn btn-primary">Back to home <i class="ri-arrow-right-up-line"
              aria-hidden="true"></i></a>
          <a href="/services.html" class="error-secondary-link">Explore services <i class="ri-arrow-right-line"
              aria-hidden="true"></i></a>
        </div>
      </div>
    </section>
  </main>
  <include src="html/partials/footers/default.html"></include>
  <script defer src="/assets/loader.js"></script>

  <script type="module" src="/src/js/main.js"></script>
</body>

</html>
